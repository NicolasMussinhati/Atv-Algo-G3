<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turfe Amigo</title>
    <link rel="stylesheet" href="css.css">
</head>

<body>

    <h1> Turfe Amigo </h1>

    <div class="layout">

        <!-- ================= ABA ESQUERDA ================= -->
        <aside class="aba-esquerda">

            <!-- ETAPA 1: CONFIGURAÇÃO -->
            <section class="bloco" id="etapa-config">
                <h2>1. Configuração do Turfe</h2>

                <div class="campos-lado-a-lado">
                    <label class="campo">
                        Competidores
                        <input type="number" id="qtd_cavalos" min="2" placeholder="Ex.: 4" />
                    </label>
                    <label class="campo">
                        Voltas
                        <input type="number" id="qtd_voltas" min="1" placeholder="Ex.: 10" />
                    </label>
                </div>

                <div id="erro-config"></div>
                <button type="button" class="largo" onclick="registrarCorrida()">Registrar Corrida</button>
            </section>

            <!-- ETAPA 2: NOMES DOS CAVALOS -->
            <section class="bloco" id="etapa-nomes">
                <h2>2. Nomes dos Cavalos</h2>

                <div class="linha-cadastro" id="lista-inputs-nomes">
                    <input type="text" id="nome_cavalo" placeholder="Nome do cavalo" />
                    <button type="button" onclick="nomearCavalo()">Adicionar</button>
                </div>

                <!-- Contador: o JS vai preencher estes dois números depois -->
                <div class="contador">
                    <span><strong id="qtd_cadastrados">0</strong> cadastrados</span>
                    <span><strong id="qtd_faltam">0</strong> faltam</span>
                </div>
                <progress id="progresso_cadastro" value="0" max="0"></progress>
            </section>

            <!-- LISTA DE COMPETIDORES CADASTRADOS -->
            <section class="bloco" id="etapa-lista">
                <h2>Competidores cadastrados</h2>

                <ul id="lista_competidores">
                    <!-- Exemplos de itens: apague quando ligar o JavaScript -->
                </ul>
                <!-- Mostrar quando a lista estiver vazia -->
                <p class="vazio" hidden>Nenhum cavalo cadastrado ainda.</p>

                <button type="button" class="largo destaque" style="margin-top:14px">Iniciar Corrida!</button>
            </section>

        </aside>

        <!-- ================= ÁREA PRINCIPAL ================= -->
        <main class="principal">

            <!-- ETAPA 3: CORRIDA -->
            <section id="etapa-corrida">
                <h2>3. Corrida em Andamento (<span id="info-voltas">0</span> voltas)</h2>

                <div id="pista">
                    <!-- Exemplos de raias: o JS cria estas depois (--pos vai de 0% a 90%) -->
                    <div class="raia">
                        <div class="cavalo" style="--pos: 40%"> <span>Trovão</span></div>
                    </div>
                    <div class="raia">
                        <div class="cavalo" style="--pos: 25%"> <span>Relâmpago</span></div>
                    </div>
                </div>

               
            </section>

            <!-- ETAPA 4: PÓDIO -->
            <section id="etapa-podio">
                <h2> Extrato Final - Pódio </h2>

                <div id="resultado-podio">
                    <div class="degrau prata"><br>2º lugar</div>
                    <div class="degrau ouro"><br>1º lugar</div>
                    <div class="degrau bronze"><br>3º lugar</div>
                </div>
            </section>

        </main>
    </div>
</body>
<script>
    let lista_cavalos = []
    let qtd_volta = 0
    let qtd_cavalo = 0
    let corrida = 0
    function registrarCorrida() {
        let voltas = qtd_voltas.value
        let cavalos = qtd_cavalos.value
        if (cavalos == '' || voltas == '') {
            alert('Insira valores numericos')
        } else if (cavalos < 2 || cavalos > 6) {
            alert("Insira valores entre 2 e 6")
        } else if (corrida > 1 || corrida < 0){
                alert('Registre uma corrida por vez!')
        }else {
            corrida++
            qtd_volta = voltas
            qtd_cavalo = cavalos
            progresso_cadastro.value = lista_cavalos.length;
            progresso_cadastro.max = qtd_cavalo;
            qtd_cadastrados.innerHTML = lista_cavalos.length;
            qtd_faltam.innerHTML = qtd_cavalo - lista_cavalos.length;
        }
    }

    function nomearCavalo() {
        let cavalo = nome_cavalo.value;
        
        
        if (cavalo == '') {
            alert('Insira um nome válido')
        }
        else if (lista_cavalos.length >= qtd_cavalo){
            alert('Todos os cavalos já cadastrados')
        }else {
            lista_cavalos.push({
                nome: cavalo,
                tempo: 0
            })
            lista_competidores.innerHTML = '';

            progresso_cadastro.value = lista_cavalos.length;
            progresso_cadastro.max = qtd_cavalo;
            qtd_cadastrados.innerHTML = lista_cavalos.length;
            qtd_faltam.innerHTML = qtd_cavalo - lista_cavalos.length;

            
            for (let i = 0; i < lista_cavalos.length; i++) {
                lista_competidores.innerHTML += `<li><span class="numero">${i+1}</span> ${lista_cavalos[i].nome} </li>`
            }
        }
    }
</script>

</html>
